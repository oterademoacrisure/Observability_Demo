apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: rajneeshhajelaai/worker:1.0.0   # ✅ pinned to your repo + tag
        ports:
        - name: http
          containerPort: 80
      # ❌ exporter removed (invalid image)
