global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'vote'
    static_configs:
      - targets: ['vote:80']

  - job_name: 'result'
    static_configs:
      - targets: ['result:80']

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:80']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'db'
    static_configs:
      - targets: ['db:5432']
